<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Book - Jagirdar Publications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Noto Serif Devanagari', 'serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fcf9f2', 100: '#f7f1e1', 200: '#eedfc0', 300: '#e3c696',
                            400: '#d5a967', 500: '#c9a227', 600: '#b17b2f', 700: '#935d29',
                            800: '#7A1F1F', 900: '#3B2A1D',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body id="main-body" class="min-h-screen bg-brand-50 text-brand-900 font-sans" style="display: none;">
    <div class="min-h-screen flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-6xl rounded-3xl border border-brand-200 bg-white shadow-2xl overflow-hidden">
            <div class="grid md:grid-cols-2">
                <div class="bg-brand-100 p-8 flex items-center justify-center">
                    <img src="images/cover1.png" alt="Book cover" class="w-full max-w-md rounded-2xl shadow-xl object-cover">
                </div>
                <div class="p-8 md:p-10">
                    <p class="text-sm font-semibold uppercase tracking-[0.2em] text-brand-600">Premium Hardcover</p>
                    <h1 class="mt-3 text-3xl font-serif font-bold text-brand-900">ब्रह्मांशावतार श्री खेतेश्वर दाता</h1>
                    <p class="mt-4 text-base leading-relaxed text-brand-700">
                        A detailed and researched spiritual book on the divine life, miracles, and legacy of Brahmrshi Shri Kheteshwar Datt. A meaningful collection for readers interested in culture, devotion, and history.
                    </p>

                    <div class="mt-6 rounded-2xl border border-brand-200 bg-brand-50 p-4">
                        <div class="flex items-center justify-between">
                            <span class="text-lg font-semibold text-brand-900">Price</span>
                            <span id="book-price-display" class="text-2xl font-bold text-brand-800">₹399</span>
                        </div>
                    </div>

                    <div class="mt-6">
                        <label class="mb-2 block text-sm font-semibold text-brand-800">Quantity</label>
                        <div class="flex items-center gap-3">
                            <button id="decrease-btn" type="button" class="h-10 w-10 rounded-full border border-brand-300 text-xl font-semibold text-brand-800 hover:bg-brand-100">−</button>
                            <input id="quantity" type="number" min="1" value="1" class="h-10 w-20 rounded-xl border border-brand-200 bg-brand-50 text-center text-lg font-semibold outline-none" readonly>
                            <button id="increase-btn" type="button" class="h-10 w-10 rounded-full border border-brand-300 text-xl font-semibold text-brand-800 hover:bg-brand-100">+</button>
                        </div>
                    </div>

                    <div class="mt-8 flex flex-wrap gap-3">
                        <button id="order-btn" type="button" class="rounded-2xl bg-brand-800 px-6 py-3 text-base font-semibold text-white transition hover:bg-brand-900">Proceed</button>
                        <a href="index.html" class="rounded-2xl border border-brand-300 px-6 py-3 text-base font-semibold text-brand-800 transition hover:bg-brand-50">Back to Home</a>
                    </div>

                    <p id="order-message" class="mt-5 text-sm text-brand-700"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const quantityInput = document.getElementById('quantity');
        const decreaseBtn = document.getElementById('decrease-btn');
        const increaseBtn = document.getElementById('increase-btn');
        const orderBtn = document.getElementById('order-btn');
        const orderMessage = document.getElementById('order-message');

        const getAuth = () => {
            try {
                return JSON.parse(sessionStorage.getItem('bookAuth') || localStorage.getItem('bookAuth') || 'null');
            } catch (e) {
                return null;
            }
        };

        if (!getAuth()) {
            window.location.href = 'login.html?redirect=index.html#about';
        }

        const updateQty = (delta) => {
            const next = Math.max(1, parseInt(quantityInput.value || '1', 10) + delta);
            quantityInput.value = next;
        };

        decreaseBtn.addEventListener('click', () => updateQty(-1));
        increaseBtn.addEventListener('click', () => updateQty(1));

        orderBtn.addEventListener('click', () => {
            const auth = getAuth();
            if (!auth) {
                window.location.href = 'login.html?redirect=order.html';
                return;
            }
            const quantity = parseInt(quantityInput.value || '1', 10);
            sessionStorage.setItem('bookQuantity', quantity.toString());
            orderMessage.textContent = `Ready to proceed for ${quantity} copy${quantity > 1 ? 'ies' : 'y'} by ${auth.name || 'the customer'}.`;
            orderMessage.className = 'mt-5 text-sm text-brand-700';
            window.location.href = 'address.html';
        });

        // Redirect if order online is disabled & fetch store settings
        async function checkSettings() {
            try {
                const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? '' : 'https://jagirdar.vercel.app';
                const res = await fetch(`${API_BASE}/api/settings/frontend`);
                const data = await res.json();
                if (!data.success || !data.settings || data.settings.isOrderNowEnabled !== true) {
                    window.location.href = 'index.html';
                } else {
                    if (data.settings.bookPrice !== undefined) {
                        const priceDisplay = document.getElementById('book-price-display');
                        if (priceDisplay) priceDisplay.textContent = `₹${data.settings.bookPrice}`;
                    }
                    document.getElementById('main-body').style.display = 'block';
                }
            } catch (err) {
                window.location.href = 'index.html';
            }
        }
        checkSettings();

        // Disable right click & developer tool shortcuts
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
