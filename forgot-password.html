<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Jagirdar Publications</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Noto Serif Devanagari"', 'serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                            900: '#7c2d12',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-50 font-sans text-gray-800 antialiased selection:bg-brand-200 selection:text-brand-900 min-h-screen flex items-center justify-center py-10 px-4 sm:px-6 lg:px-8">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-brand-100 overflow-hidden">
        <div class="bg-gradient-to-br from-brand-800 to-brand-900 px-6 py-10 text-center relative overflow-hidden">
            <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
            <h1 class="font-serif text-3xl font-bold text-white relative z-10">Reset Password</h1>
            <p class="mt-2 text-brand-100 text-sm font-medium relative z-10">We'll send a verification OTP to your WhatsApp</p>
        </div>

        <div class="px-6 py-8 sm:px-10">
            <form id="reset-form" class="space-y-5">
                <div>
                    <label for="email" class="mb-1 block text-sm font-semibold text-brand-900">Registered Email or Mobile Number</label>
                    <input id="email" name="email" type="text" placeholder="Registered Email or 10-digit Mobile" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none transition focus:border-brand-500 focus:bg-white focus:ring-2 focus:ring-brand-200" required>
                </div>

                <button id="send-otp-btn" type="button" class="w-full rounded-xl bg-brand-800 px-4 py-3 text-sm font-semibold text-white transition hover:bg-brand-900 shadow-md">
                    Send Reset WhatsApp OTP
                </button>

                <div id="otp-section" class="hidden pt-4 border-t border-gray-100 space-y-4">
                    <div>
                        <label for="otp" class="mb-1 block text-sm font-semibold text-brand-900">Enter WhatsApp / Email OTP</label>
                        <input id="otp" name="otp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="------" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-center text-xl font-bold tracking-[0.5em] outline-none transition focus:border-brand-500 focus:bg-white focus:ring-2 focus:ring-brand-200">
                    </div>

                    <button id="verify-otp-btn" type="button" class="w-full rounded-xl bg-brand-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-brand-700 shadow-md">
                        Verify OTP
                    </button>
                </div>

                <div id="password-section" class="hidden pt-4 border-t border-gray-100 space-y-4">
                    <div>
                        <label for="newPassword" class="mb-1 block text-sm font-semibold text-brand-900">New Password</label>
                        <input id="newPassword" name="newPassword" type="password" placeholder="Create a new password" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none transition focus:border-brand-500 focus:bg-white focus:ring-2 focus:ring-brand-200">
                    </div>

                    <button id="reset-btn" type="submit" class="w-full rounded-xl bg-green-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-green-700 shadow-md">
                        Save New Password
                    </button>
                </div>
            </form>

            <p id="status-message" class="mt-5 text-center text-sm font-semibold text-brand-700"></p>
            
            <div class="mt-6 border-t border-gray-100 pt-6 text-center">
                <p class="text-sm text-gray-600">Remembered your password? <a href="login.html" class="font-bold text-brand-700 hover:text-brand-900 transition underline underline-offset-2">Login here</a></p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('reset-form');
        const emailInput = document.getElementById('email');
        const otpInput = document.getElementById('otp');
        const newPasswordInput = document.getElementById('newPassword');
        
        const otpSection = document.getElementById('otp-section');
        const passwordSection = document.getElementById('password-section');
        
        const sendOtpBtn = document.getElementById('send-otp-btn');
        const verifyOtpBtn = document.getElementById('verify-otp-btn');
        const resetBtn = document.getElementById('reset-btn');
        const statusMessage = document.getElementById('status-message');

        const API_HOST = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? '' 
            : (window.location.hostname.includes('vercel.app') ? '' : 'https://jagirdar.vercel.app');
        const API_BASE = `${API_HOST}/api/auth`;
        let otpSent = false;
        let otpVerified = false;
        let countdownInterval = null;

        const showStatus = (message, type = 'info') => {
            statusMessage.textContent = message;
            statusMessage.className = `mt-5 text-center text-sm font-semibold ${
                type === 'error' ? 'text-red-600' : type === 'success' ? 'text-emerald-600' : 'text-brand-700'
            }`;
        };

        const startResendTimer = (seconds = 90) => {
            let timeLeft = seconds;
            sendOtpBtn.disabled = true;
            sendOtpBtn.classList.replace('bg-brand-800', 'bg-brand-600');
            sendOtpBtn.classList.add('cursor-not-allowed', 'opacity-70');

            if (countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    sendOtpBtn.disabled = false;
                    sendOtpBtn.textContent = 'Resend OTP';
                    sendOtpBtn.classList.replace('bg-brand-600', 'bg-brand-800');
                    sendOtpBtn.classList.remove('cursor-not-allowed', 'opacity-70');
                } else {
                    sendOtpBtn.textContent = `Resend in ${timeLeft}s`;
                    timeLeft--;
                }
            }, 1000);
        };

        sendOtpBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();

            if (!email) {
                showStatus('Please enter your email address.', 'error');
                return;
            }

            sendOtpBtn.disabled = true;
            sendOtpBtn.textContent = 'Sending...';
            showStatus('Sending OTP to your email...');

            try {
                const res = await fetch(`${API_BASE}/forgot-password-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    sendOtpBtn.disabled = false;
                    sendOtpBtn.textContent = 'Send Reset OTP';
                    throw new Error(data.error || 'Failed to send OTP');
                }

                otpSent = true;
                otpSection.classList.remove('hidden');
                emailInput.disabled = true; // Lock email input
                
                otpInput.focus();
                startResendTimer(90);
                showStatus(`📧 OTP sent successfully. Please check your email inbox.`, 'success');

            } catch (err) {
                sendOtpBtn.disabled = false;
                sendOtpBtn.textContent = 'Send Reset OTP';
                showStatus(err.message, 'error');
            }
        });

        verifyOtpBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const otp = otpInput.value.trim();

            if (!otp) {
                showStatus('Please enter the OTP.', 'error');
                return;
            }

            verifyOtpBtn.disabled = true;
            verifyOtpBtn.textContent = 'Verifying...';

            try {
                const res = await fetch(`${API_BASE}/verify-reset-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Invalid OTP');
                }

                otpVerified = true;
                otpSection.classList.add('hidden'); // Hide OTP section
                passwordSection.classList.remove('hidden'); // Show Password Section
                
                if (countdownInterval) {
                    clearInterval(countdownInterval); // Stop resend timer
                    sendOtpBtn.classList.add('hidden'); // Hide send OTP button entirely
                }
                
                newPasswordInput.focus();
                showStatus(`✅ OTP Verified. Please enter your new password.`, 'success');

            } catch (err) {
                verifyOtpBtn.disabled = false;
                verifyOtpBtn.textContent = 'Verify OTP';
                showStatus(err.message, 'error');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!otpVerified) {
                showStatus('Please verify the OTP first.', 'error');
                return;
            }

            const email = emailInput.value.trim();
            const otp = otpInput.value.trim();
            const newPassword = newPasswordInput.value.trim();

            if (!newPassword) {
                showStatus('Please enter a new password.', 'error');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = 'Saving...';

            try {
                const res = await fetch(`${API_BASE}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp, newPassword })
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Password reset failed.');
                }

                showStatus('🎉 Password Reset Successfully! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);

            } catch (err) {
                resetBtn.disabled = false;
                resetBtn.textContent = 'Save New Password';
                showStatus(err.message, 'error');
            }
        });

        // Disable right click & developer tool shortcuts
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
